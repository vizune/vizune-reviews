<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Vizune Reviews — Coming Soon</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="splash">
    	<div style="display: flex; gap: 16px; align-items: center;">
	      <img
	        src="star-left.png"
	        alt=""
	        aria-hidden
	      />

	      <img
	        class="splash__logo"
	        src="review-title.png"
	        alt="Vizune Reviews"
	      />
	      
	      <img
	        src="star-right.png"
	        alt=""
	        aria-hidden
	      />
	</div>

      <div class="splash__preview">
        <img
          src="vizune-review-preview.png"
          alt="Sneak preview of Vizune Reviews"
        />
      </div>

      <div class="splash__content">
        <p class="splash__coming-soon">Coming soon</p>
        <h1>Unearth hidden gems.</h1>

        <p class="splash__description">
          Beautiful worlds, cult favourites and unforgettable stories
          waiting to be discovered.
        </p>
      </div>
    </main>
  </body>
